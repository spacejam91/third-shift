<html lang="en">
<head>
<meta charset="utf-8">
<title>Third Shift motion</title>
<!--
  The animated videos for X, Instagram, TikTok and LinkedIn. tools/render-motion.mjs loads this page,
  calls window.frame(t) for every frame (t in seconds) and pipes the screenshots to ffmpeg, so every
  frame is drawn from t alone: no CSS animations, no timers, nothing random.
    ?scene=reveal   the day's last light turns into the crescent, then the name, the line and thirdshift.ca
    ?scene=shift    an example night as a checklist, 11 PM to 7 AM, each job ticked off, ending on the logo
    &mono=1         black on white, to match the profile pictures and covers (tools/brand/art.html mono=1);
                    without it, the site's night and amber
  Flat on purpose: one solid background, a flat crescent and flat type. No gradients, glows or hairlines,
  which turn blotchy when a platform recompresses the video. Every move eases in and settles; nothing
  bounces, blurs, types itself or flashes.
  In a browser, add &play=1 to watch it in real time, or &t=6.5 to hold one moment while editing.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=block" rel="stylesheet">
<style>
:root {
  --bg: #060A14; --card: #0B1220; --edge: #18233A; --rule: #18233A;
  --ink: #ECF1F8; --ink-2: #C3CFE0; --muted: #8B9BB4; --accent: #F2B055;
  --kicker-weight: 500; --url: var(--ink-2); --url-weight: 400; --held-weight: 400;
}
/* No colour at all. The small mono text is heavier, so its edges survive a platform's recompression. */
:root.mono {
  --bg: #FFFFFF; --card: #FFFFFF; --edge: #0A0A0A; --rule: #E3E3E3;
  --ink: #0A0A0A; --ink-2: #3A3A3A; --muted: #4D4D4D; --accent: #0A0A0A;
  --kicker-weight: 600; --url: #1A1A1A; --url-weight: 500; --held-weight: 600;
}
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
body { font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); }
.moon { display: block; overflow: visible; }

/* The closing lockup, the same as the flat Instagram post */
.stack { position: absolute; left: 0; right: 0; display: grid; justify-items: center; text-align: center; }
/* Bricolage Grotesque's ink traps read as cracks at logo size; a matching stroke under the fill closes them */
.name { font-weight: 700; letter-spacing: -.02em; line-height: normal; font-variation-settings: "opsz" 72; white-space: nowrap; -webkit-text-stroke: .018em currentColor; paint-order: stroke fill; }
.line { font-weight: 600; letter-spacing: -.04em; line-height: 1.08; font-variation-settings: "opsz" 96; white-space: nowrap; }
.line em { font-style: normal; color: var(--accent); }
.kicker { font-family: "IBM Plex Mono", monospace; font-weight: var(--kicker-weight); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
.url { font-family: "IBM Plex Mono", monospace; font-weight: var(--url-weight); color: var(--url); letter-spacing: .04em; white-space: nowrap; }
/* text that rises into place from behind its own baseline */
.clip { overflow: clip; overflow-clip-margin: .22em; }

/* The shift checklist */
.top { position: absolute; display: flex; justify-content: space-between; align-items: center; }
.brand { display: inline-flex; align-items: center; gap: .3em; }
.label { font-family: "IBM Plex Mono", monospace; font-weight: var(--kicker-weight); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.card { position: absolute; background: var(--card); border: 2px solid var(--edge); border-radius: .75em; overflow: hidden; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; padding: 1.05em 1.4em .95em; }
.card-head b { font-weight: 600; font-size: 1.36em; letter-spacing: -.02em; }
.clock { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 1.24em; color: var(--accent); font-variant-numeric: tabular-nums; }
.track { height: .22em; background: var(--rule); }
.track i { display: block; height: 100%; width: 0; background: var(--accent); }
.rows { padding: 0 1.4em; }
.row { display: grid; grid-template-columns: 1.3em 1fr auto; column-gap: .9em; align-items: center; border-top: 2px solid var(--rule); }
.row:first-child { border-top: 0; }
.row .task { font-weight: 500; font-size: 1.28em; letter-spacing: -.01em; white-space: nowrap; }
.row .result { font-family: "IBM Plex Mono", monospace; color: var(--ink-2); white-space: nowrap; }
.row.held .result { color: var(--accent); font-weight: var(--held-weight); }
.tick { display: block; width: 1.3em; height: 1.3em; overflow: visible; }
.tally { display: flex; gap: 1.8em; padding: .95em 1.4em 1.05em; border-top: 2px solid var(--rule); font-family: "IBM Plex Mono", monospace; color: var(--muted); }
.tally b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const q = new URLSearchParams(location.search);
const scene = q.get("scene") || "reveal";
const W = innerWidth, H = innerHeight;
const tall = H / W > 1.5;                       // 9:16 stories and reels
const mono = q.get("mono") === "1";
document.documentElement.classList.toggle("mono", mono);
// Colours the SVG marks need; the rest come from the CSS variables above.
const COL = mono
  ? { bg: "#FFFFFF", accent: "#0A0A0A", ring: "#C4C4C4" }
  : { bg: "#060A14", accent: "#F2B055", ring: "#2A3752" };
const stage = document.getElementById("stage");
const NS = "http://www.w3.org/2000/svg";

// ------------------------------------------------------------------ helpers

const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ramp = (t, a, b) => clamp((t - a) / (b - a));                      // 0 before a, 1 after b
// Calm curves only: nothing overshoots or bounces.
const inOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(2 - 2 * t, 3) / 2);
const out = (t) => 1 - Math.pow(1 - t, 4);
const px = (v) => v.toFixed(2) + "px";

function el(tag, cls, ...kids) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const k of kids) e.append(k);
  return e;
}

function svg(tag, attrs = {}) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

// The crescent: the circle (13, 13) r 12 with the circle (17.5, 10.5) r 9 cut out, on a grid 100 times the
// site's 26-unit one, where Chrome draws the curves smooth instead of in flat facets. At rest it is the
// same path as tools/brand/art.html. phase(p) < 1 draws the disc with its shadow slid off toward the top
// right instead (0 is the full disc), so the shadow can move in.
// The line under the name on covers, posts and the video lockup; the bios and the site say the same.
const KICKER = "AI systems implementation · Ontario, Canada";
const CRESCENT = "M1658.18 154.69A1200 1200 0 1 0 2461.66 1600.95A900 900 0 1 1 1658.18 154.69Z";
let ids = 0;
function moon(size) {
  const id = "shadow" + ++ids;
  const s = svg("svg", { viewBox: "0 0 2600 2600", width: size, height: size, class: "moon" });
  const shadow = svg("circle", { cx: 1750, cy: 1050, r: 900, fill: "black" });
  const mask = svg("mask", { id, maskUnits: "userSpaceOnUse", x: 0, y: 0, width: 2600, height: 2600 });
  mask.append(svg("rect", { width: 2600, height: 2600, fill: "white" }), shadow);
  const disc = svg("circle", { cx: 1300, cy: 1300, r: 1200, fill: COL.accent, mask: `url(#${id})` });
  const crescent = svg("path", { d: CRESCENT, fill: COL.accent });
  s.append(mask, disc, crescent);
  s.phase = (p) => {
    const d = ((1 - p) * 1500).toFixed(2);
    shadow.setAttribute("transform", `translate(${d} ${-d})`);
    disc.style.display = p < 1 ? "" : "none";
    crescent.style.display = p < 1 ? "none" : "";
  };
  s.phase(1);
  return s;
}

// A line of text inside a clip, so it can rise into place from behind its own baseline.
function clipped(cls, size, ...kids) {
  const inner = el("div", null, ...kids);
  const box = el("div", "clip " + cls, inner);
  box.style.fontSize = px(size);
  box.inner = inner;
  return box;
}
const rise = (box, p) => { box.inner.style.transform = `translateY(${((1 - out(p)) * 1.45).toFixed(4)}em)`; };
const fadeUp = (e, p, by = .5) => {
  const k = out(p);
  e.style.opacity = k.toFixed(3);
  e.style.transform = `translateY(${((1 - k) * by).toFixed(4)}em)`;
};

// ------------------------------------------------------------------ the closing lockup

// Laid out like the flat Instagram post (tools/brand/art.html ?kind=square&flat=1), plus thirdshift.ca:
// at the foot of the frame, or under the kicker on a story, where the bottom is under the app's buttons.
function lockup(s) {
  const m = moon(Math.round(s * 17));
  const name = clipped("name", s * 9.5, "Third Shift");
  name.style.margin = `${px(s * 4)} 0 ${px(s * 3)}`;
  const lines = [["The work that gets"], ["done while you ", el("em", null, "sleep.")]].map((kids) => clipped("line", s * 5.2, ...kids));
  const kick = el("div", "kicker", KICKER);
  kick.style.fontSize = px(s * 2.1);
  kick.style.marginTop = px(s * 5);
  const url = el("div", "url", "thirdshift.ca");
  url.style.fontSize = px(s * 2.9);
  const stack = el("div", "stack", m, name, ...lines, kick);
  if (tall) { url.style.marginTop = px(s * 3.4); stack.append(url); }
  else { url.style.cssText += `position:absolute;left:0;right:0;text-align:center;bottom:${px(Math.min(W, H) * .065)}`; }
  stage.append(stack);
  if (!tall) stage.append(url);
  const h = stack.getBoundingClientRect().height;
  stack.style.top = px((H - h) / 2 - (tall ? H * .035 : 0));
  return { m, name, lines, kick, url, stack };
}

// ------------------------------------------------------------------ scene: logo reveal

function buildReveal() {
  const s = Math.min(W, H) / 100 * (tall ? 1.3 : 1);
  const L = lockup(s);
  // the crescent's resting place; it starts larger, in the middle of the frame
  const r = L.m.getBoundingClientRect();
  const dy = H / 2 - (r.top + r.height / 2);
  const START = 1.45;

  function frame(t) {
    // The day's last light: a full disc that the night's shadow turns into the crescent.
    L.m.phase(inOut(ramp(t, .35, 1.95)));
    // The crescent settles into the lockup as the name comes up underneath it.
    const mv = inOut(ramp(t, 2.0, 3.1));
    L.m.style.transform = `translateY(${px(dy * (1 - mv))}) scale(${lerp(START, 1, mv).toFixed(4)})`;
    rise(L.name, ramp(t, 2.55, 3.5));
    L.lines.forEach((line, k) => rise(line, ramp(t, 3.25 + k * .14, 4.2 + k * .14)));
    fadeUp(L.kick, ramp(t, 4.4, 5.1));
    fadeUp(L.url, ramp(t, 4.8, 5.5));
  }
  return { frame, duration: 9 };
}

// ------------------------------------------------------------------ scene: the overnight shift

// The example nights, picked with &night= (the general one when it's left out). Inquiries, quotes,
// reports and schedules come first and invoices after, so a shift doesn't read as a bookkeeping service.
// Each row is [clock time, job, result, "held" for one left for a person to approve].
// The industry nights are the ones on the "Who it's for" pages (content/industries.mjs), shortened to
// fit the card but with the same times, order and numbers: change one, change the other. Their jobs tick
// at an even pace and the clock hurries through the quiet hours; the general night's clock runs steady.
const NIGHTS = {
  "general": { label: "Example shift", start: "11:00 PM", steady: true, rows: [
    ["11:12 PM", "Web inquiries", "9 answered"],
    ["12:04 AM", "Open quotes", "14 followed up"],
    ["12:58 AM", "Weekly sales report", "ready"],
    ["1:51 AM", "Crew schedules", "6 sent"],
    ["2:47 AM", "Appointment reminders", "22 sent"],
    ["3:40 AM", "Supplier invoices", "36 matched to POs"],
    ["4:26 AM", "Invoice over its PO", "held for you", "held"],
    ["6:15 AM", "Morning summary", "in your inbox"],
  ] },
  "trades": { label: "Example: trades", start: "9:00 PM", rows: [
    ["9:40 PM", "Quotes with no answer", "5 followed up"],
    ["10:15 PM", "Website inquiries", "3 answered"],
    ["11:15 PM", "Tomorrow’s crew schedules", "sent"],
    ["11:20 PM", "Customer reminders", "queued for 8 AM"],
    ["11:50 PM", "Supplier invoices", "14 matched to jobs"],
    ["11:52 PM", "2 billed to a closed job", "held for you", "held"],
    ["6:30 AM", "Timesheets", "1 crew missing Thursday"],
  ] },
  "distributors": { label: "Example: distributor", start: "9:30 PM", rows: [
    ["10:05 PM", "Emailed customer orders", "23 read"],
    ["10:12 PM", "Draft orders", "21 entered"],
    ["10:14 PM", "2 unknown item codes", "held for you", "held"],
    ["11:30 PM", "Supplier invoices", "46 matched to POs"],
    ["1:00 AM", "Reorder list", "9 items below minimum"],
    ["2:15 AM", "Past-due statements", "7 drafted"],
    ["6:50 AM", "Morning summary", "in your inbox"],
  ] },
  "clinics": { label: "Example: clinic", start: "9:30 PM", rows: [
    ["10:10 PM", "Website inquiries", "booking link sent"],
    ["10:40 PM", "Next week’s staff schedule", "sent"],
    ["11:30 PM", "Supply reorder list", "6 items low"],
    ["2:00 AM", "Monthly numbers", "ready"],
    ["2:30 AM", "Supplier invoices", "16 matched to orders"],
    ["2:33 AM", "2 invoices to review", "held for you", "held"],
    ["6:45 AM", "Morning summary", "to the manager"],
  ] },
  "professional-services": { label: "Example: professional firm", start: "8:00 PM", rows: [
    ["8:30 PM", "Year-end papers", "6 reminders sent"],
    ["9:15 PM", "New client set up", "letter drafted"],
    ["11:00 PM", "3 entries, no client code", "held for you", "held"],
    ["1:00 AM", "Invoices from approved time", "drafted"],
    ["2:30 AM", "Overdue accounts", "listed for Monday"],
    ["6:45 AM", "Morning summary", "in your inbox"],
  ] },
  "manufacturers": { label: "Example: manufacturer", start: "5:30 PM", rows: [
    ["6:00 PM", "Shift timesheets", "checked"],
    ["9:00 PM", "Material reorders", "list ready"],
    ["10:30 PM", "Weekly report", "ready"],
    ["11:20 PM", "Supplier invoices", "31 matched to POs"],
    ["11:24 PM", "Steel 8% over the PO", "held for you", "held"],
    ["6:30 AM", "Morning summary", "to the shop manager"],
  ] },
};
// "9:40 PM" -> minutes after noon, so a night from the evening to 7 AM counts up without wrapping
const minutesOf = (time) => {
  const [, h, m, half] = time.match(/^(\d+):(\d\d) (AM|PM)$/);
  return (+h % 12) * 60 + +m + (half === "AM" ? 720 : 0);
};

// The status mark: an empty ring, an arc that fills it while the job runs, then a check
// (done) or a pause (held for a person).
function tick() {
  const C = 2 * Math.PI * 10.5, CHECK = 14;
  const s = svg("svg", { viewBox: "0 0 24 24", class: "tick" });
  const ring = svg("circle", { cx: 12, cy: 12, r: 10.5, fill: "none", stroke: COL.ring, "stroke-width": 2 });
  const arc = svg("circle", { cx: 12, cy: 12, r: 10.5, fill: "none", stroke: COL.accent, "stroke-width": 2, transform: "rotate(-90 12 12)", "stroke-dasharray": C.toFixed(3), "stroke-dashoffset": C.toFixed(3) });
  const disc = svg("circle", { cx: 12, cy: 12, r: 11.5, fill: COL.accent, opacity: 0 });
  const check = svg("path", { d: "M7.2 12.4l3.3 3.3 6.4-6.6", fill: "none", stroke: COL.bg, "stroke-width": 2.5, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": CHECK, "stroke-dashoffset": CHECK });
  const pause = svg("g", { fill: COL.accent, opacity: 0 });
  pause.append(svg("rect", { x: 7.9, y: 7, width: 3, height: 10, rx: .7 }), svg("rect", { x: 13.1, y: 7, width: 3, height: 10, rx: .7 }));
  s.append(ring, arc, disc, check, pause);
  s.set = ({ running, done, held }) => {
    arc.setAttribute("stroke-dashoffset", (C * (1 - running)).toFixed(3));
    if (held) { pause.setAttribute("opacity", done.toFixed(3)); return; }
    disc.setAttribute("opacity", clamp(done * 3).toFixed(3));
    check.setAttribute("stroke-dashoffset", (CHECK * (1 - clamp(done * 1.4 - .3))).toFixed(3));
  };
  return s;
}

function buildShift() {
  const night = NIGHTS[q.get("night") || "general"];
  if (!night) throw new Error(`No example night called "${q.get("night")}": add it to NIGHTS in tools/brand/motion.html`);
  const s = W / 100 * (tall ? 1.2 : 1);
  const pad = W * .06;

  const brandMoon = moon(Math.round(s * 4.6));
  const brandName = el("span", "name", "Third Shift");
  const brand = el("div", "brand", brandMoon, brandName);
  brand.style.fontSize = px(s * 4.4);
  const label = el("div", "label", night.label);
  label.style.fontSize = px(s * 2.1);
  const top = el("div", "top", brand, label);
  top.style.left = top.style.right = px(pad);

  const card = el("div", "card");
  card.style.cssText += `left:${px(pad)};right:${px(pad)};font-size:${px(s * 2.6)}`;
  const clock = el("span", "clock", night.start);
  const fill = el("i");
  const rowsBox = el("div", "rows");
  const doneN = el("b", null, "0"), heldN = el("b", null, "0");
  card.append(
    el("div", "card-head", el("b", null, "Tonight’s shift"), clock),
    el("div", "track", fill),
    rowsBox,
    el("div", "tally", el("span", null, doneN, " done"), el("span", null, heldN, " held for you")),
  );
  const rows = night.rows.map(([, job, result, held]) => {
    const mark = tick();
    const task = el("span", "task", job), res = el("span", "result", result);
    const row = el("div", "row" + (held ? " held" : ""), mark, task, res);
    row.style.height = (tall ? 3.25 : 3) + "em";
    rowsBox.append(row);
    return { row, mark, task, res, held: !!held };
  });
  stage.append(top, card);
  for (const r of rows) {
    if (r.row.scrollWidth > r.row.clientWidth + 1) throw new Error(`Too long for the card at ${W}x${H}: "${r.row.textContent}"`);
  }

  // centre the bar and the card together, inside the part of a story the app's buttons don't cover
  const th = top.getBoundingClientRect().height, ch = card.getBoundingClientRect().height;
  const gap = s * (tall ? 6 : 4.5);
  const [lo, hi] = tall ? [H * .09, H * .8] : [0, H];
  const y0 = lo + (hi - lo - (th + gap + ch)) / 2;
  top.style.top = px(y0);
  card.style.top = px(y0 + th + gap);

  const L = lockup(Math.min(W, H) / 100 * (tall ? 1.3 : 1));

  // The night runs from t = 0.7 to t = 9.3, then a beat on the finished list, then the logo.
  const T0 = .7, T1 = 9.3, OUT = 10.2, END = 10.6;
  // minutes into the shift, counted from its start
  const start = minutesOf(night.start), length = minutesOf("7:00 AM") - start;
  const mins = night.rows.map(([time]) => minutesOf(time) - start);
  const doneAt = night.steady
    ? mins.map((m) => T0 + (m / length) * (T1 - T0))
    : mins.map((_, k) => T0 + (k + .7) * (T1 - T0) / mins.length);
  // a steady clock, or one that passes through each job's time as it ticks
  const knots = [[T0, 0], ...doneAt.map((t, k) => [t, mins[k]]), [T1, length]];
  const minuteAt = (t) => {
    if (night.steady) return clamp((t - T0) / (T1 - T0)) * length;
    const k = knots.findIndex(([kt]) => kt >= t);
    if (k <= 0) return k ? length : 0;
    const [t0, m0] = knots[k - 1], [t1, m1] = knots[k];
    return lerp(m0, m1, (t - t0) / (t1 - t0));
  };
  const clockText = (m) => {
    const v = (720 + start + Math.floor(m)) % 1440, h24 = Math.floor(v / 60);
    return `${h24 % 12 || 12}:${String(v % 60).padStart(2, "0")} ${h24 < 12 ? "AM" : "PM"}`;
  };

  function frame(t) {
    const m = minuteAt(t);
    clock.textContent = clockText(m);
    fill.style.width = (m / length * 100).toFixed(3) + "%";
    let done = 0, held = 0;
    rows.forEach((r, k) => {
      const at = doneAt[k];
      const running = out(ramp(t, at - .6, at));
      r.mark.set({ running, done: ramp(t, at, at + .35), held: r.held });
      r.task.style.opacity = lerp(.4, 1, ramp(t, at - .6, at - .3)).toFixed(3);
      fadeUp(r.res, ramp(t, at, at + .45), .35);
      if (t >= at) r.held ? held++ : done++;
    });
    doneN.textContent = String(done);
    heldN.textContent = String(held);

    // the list steps back and the logo comes up in its place
    const o = inOut(ramp(t, OUT, OUT + .6));
    for (const e of [top, card]) {
      e.style.opacity = (1 - o).toFixed(3);
      e.style.transform = `translateY(${px(-o * s * 2)})`;
    }
    fadeUp(L.m, ramp(t, END, END + .8), .25);
    rise(L.name, ramp(t, END + .15, END + 1.05));
    L.lines.forEach((line, k) => rise(line, ramp(t, END + .45 + k * .14, END + 1.35 + k * .14)));
    fadeUp(L.kick, ramp(t, END + 1.2, END + 1.85));
    fadeUp(L.url, ramp(t, END + 1.45, END + 2.1));
  }
  return { frame, duration: 14.5 };
}

// ------------------------------------------------------------------ wiring

// Load every face the scenes use before laying anything out, so no frame is drawn in a fallback font.
const FACES = ['500 40px "Bricolage Grotesque"', '600 40px "Bricolage Grotesque"', '700 40px "Bricolage Grotesque"', '400 40px "IBM Plex Mono"', '500 40px "IBM Plex Mono"', '600 40px "IBM Plex Mono"'];
Promise.all(FACES.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
  let built;
  try {
    built = (scene === "shift" ? buildShift : buildReveal)();
  } catch (err) {
    // the exporter reads this and stops with the message
    document.body.dataset.error = err.message;
    document.body.dataset.ready = "1";
    throw err;
  }
  const { frame, duration } = built;
  frame(0);
  window.DURATION = duration;
  // The exporter calls this, then takes the picture; taking it paints the frame, so no waiting here.
  window.frame = (t) => { frame(t); return true; };
  if (q.get("t")) frame(+q.get("t"));
  document.body.dataset.ready = "1";
  if (q.get("play")) {
    const t0 = performance.now();
    const loop = (now) => { frame(((now - t0) / 1000) % duration); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
});
</script>
</body>
</html>
