<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Third Shift CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  Third Shift CRM, the screen. Served by Crm.gs (HtmlService) and talks to it only through
  google.script.run. Everything that comes from the sheet is put on the page as text nodes, never
  as HTML, so a lead who types markup into the website form can't run anything here.
-->
<style>
:root {
  color-scheme: dark;
  --night-0: #050913;
  --night-1: #08101F;
  --panel: #0D1629;
  --panel-2: #111D36;
  --panel-3: #16233F;
  --ink: #ECF1F8;
  --ink-2: #C3CFE0;
  --muted: #95A6BF;
  --faint: #6A7C98;
  --line: rgba(236, 241, 248, .09);
  --line-2: rgba(236, 241, 248, .17);
  --amber: #F2B055;
  --amber-hot: #FFD08A;
  --amber-soft: rgba(242, 176, 85, .12);
  --dawn: #FF8F4D;
  --on-amber: #0B1222;
  --err: #FF8A73;
  --ok: #7FD1AE;
  --sans: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  font: 15px/1.5 var(--sans); color: var(--ink);
  background:
    radial-gradient(1100px 480px at 78% -12%, rgba(242, 176, 85, .09), transparent 62%),
    radial-gradient(900px 560px at -5% -10%, rgba(84, 116, 190, .12), transparent 60%),
    var(--night-0);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--amber-hot); text-decoration-color: rgba(255, 208, 138, .35); text-underline-offset: .2em; }
a:hover { text-decoration-color: var(--amber); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------------ top bar */
.bar {
  position: sticky; top: 0; z-index: 20;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .8rem 1.4rem;
  padding: .8rem clamp(1rem, 3vw, 2rem);
  background: rgba(5, 9, 19, .8);
  -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: .55rem; font-weight: 700; font-size: 1.06rem; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; flex: none; }
.tag { font: 500 .64rem/1 var(--mono); letter-spacing: .16em; color: var(--amber); border: 1px solid rgba(242, 176, 85, .38); border-radius: 999px; padding: .3rem .5rem; }
.tabs { justify-self: center; display: flex; gap: .2rem; padding: .25rem; border: 1px solid var(--line); border-radius: 12px; background: rgba(13, 22, 41, .65); overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.tabs button { flex: none; display: flex; align-items: center; gap: .45rem; border: 0; background: transparent; color: var(--muted); padding: .45rem .9rem; border-radius: 9px; font-weight: 500; transition: color .2s, background .2s, box-shadow .2s; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-current="page"] { background: var(--panel-3); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.pill { font: 500 .68rem/1 var(--mono); background: var(--amber); color: var(--on-amber); border-radius: 999px; padding: .22rem .42rem; }
.bar-right { display: flex; align-items: center; gap: .6rem; }
.search { display: flex; align-items: center; gap: .5rem; height: 38px; width: 250px; padding: 0 .7rem; border: 1px solid var(--line-2); border-radius: 10px; background: rgba(5, 9, 19, .6); color: var(--faint); transition: border-color .2s, box-shadow .2s; }
.search:focus-within { border-color: var(--amber); box-shadow: 0 0 0 4px rgba(242, 176, 85, .14); }
.search svg { width: 15px; height: 15px; flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); }
.search input::-webkit-search-cancel-button { filter: invert(.6); }
kbd { font: 500 .68rem var(--mono); color: var(--faint); border: 1px solid var(--line-2); border-radius: 5px; padding: .08rem .35rem; }
.me { font: 400 .72rem var(--mono); color: var(--faint); max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 1100px) { .me { display: none; } }
@media (max-width: 860px) {
  .bar { grid-template-columns: 1fr auto; }
  .tabs { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; }
  .search { width: 170px; }
}
@media (max-width: 520px) {
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); }
  .tabs button { justify-content: center; padding: .45rem .25rem; font-size: .88rem; gap: .3rem; }
  .search { display: none; }
  .bar.searching .search { display: flex; position: absolute; inset: .7rem 1rem auto; width: auto; background: var(--night-1); z-index: 2; }
}
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line-2); background: transparent; color: var(--ink-2); transition: color .2s, border-color .2s; }
.icon-btn:hover { color: var(--ink); border-color: var(--amber); }
.icon-btn svg { width: 16px; height: 16px; }
.only-narrow { display: none; }
@media (max-width: 520px) { .only-narrow { display: inline-grid; } }

/* ------------------------------------------------------------------ buttons, fields */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  height: 38px; padding: 0 1rem; border: 0; border-radius: 10px; white-space: nowrap;
  font-weight: 600; color: var(--on-amber);
  background: linear-gradient(180deg, var(--amber-hot), var(--amber));
  box-shadow: 0 10px 26px -12px rgba(242, 176, 85, .85), inset 0 1px 0 rgba(255, 255, 255, .45);
  transition: filter .2s, transform .15s, opacity .2s;
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; filter: none; transform: none; }
.btn svg { width: 15px; height: 15px; }
.btn-ghost { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn-ghost:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--amber); filter: none; }
.btn-sm { height: 32px; padding: 0 .8rem; font-size: .88rem; border-radius: 8px; }
.field { display: grid; gap: .35rem; min-width: 0; }
.field > span { font: 500 .68rem/1.2 var(--mono); letter-spacing: .13em; text-transform: uppercase; color: var(--faint); }
input:not([type="checkbox"]), select, textarea {
  width: 100%; min-width: 0; padding: .6rem .75rem;
  border: 1px solid var(--line-2); border-radius: 10px; background: rgba(5, 9, 19, .65); color: var(--ink);
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.search input { padding: 0; border: 0; background: transparent; box-shadow: none; }
input:not([type="checkbox"]):focus, select:focus, textarea:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 4px rgba(242, 176, 85, .14); background: rgba(5, 9, 19, .85); }
input[aria-invalid="true"] { border-color: var(--err); }
input[type="date"] { color-scheme: dark; }
textarea { resize: vertical; min-height: 4.6rem; line-height: 1.45; }
select { appearance: none; padding-right: 2rem; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
input[type="checkbox"] { appearance: none; flex: none; width: 18px; height: 18px; margin: .12rem 0 0; border-radius: 5px; border: 1.5px solid var(--line-2); background: rgba(5, 9, 19, .6); display: grid; place-items: center; transition: background .2s, border-color .2s; }
input[type="checkbox"]::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--on-amber); border-top: 0; border-right: 0; rotate: -45deg; translate: 0 -1px; scale: 0; transition: scale .2s var(--ease); }
input[type="checkbox"]:checked { background: var(--amber); border-color: var(--amber); }
input[type="checkbox"]:checked::after { scale: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

/* ------------------------------------------------------------------ page */
.wrap { max-width: 1560px; margin: 0 auto; padding: 1.4rem clamp(1rem, 3vw, 2rem) 4rem; }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
@media (max-width: 900px) { .metrics { grid-template-columns: 1fr 1fr; gap: .7rem; } }
.metric { position: relative; overflow: hidden; padding: 1rem 1.1rem 1.05rem; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); }
.metric::before { content: ""; position: absolute; inset: 0 0 auto; height: 1px; background: linear-gradient(90deg, transparent, rgba(242, 176, 85, .6), transparent); }
.metric::after { content: ""; position: absolute; right: -40px; top: -60px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(closest-side, rgba(242, 176, 85, .08), transparent); pointer-events: none; }
.m-label { font: 500 .68rem/1 var(--mono); letter-spacing: .15em; text-transform: uppercase; color: var(--faint); }
.m-value { margin-top: .6rem; font-size: clamp(1.45rem, 2.4vw, 2.05rem); font-weight: 650; line-height: 1.1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.m-sub { margin-top: .2rem; color: var(--muted); font-size: .85rem; }
.metric.hot .m-value { color: var(--amber-hot); }
.metric.late .m-sub { color: var(--err); }

.loading { display: grid; gap: 1rem; }
.sk { height: 120px; border-radius: var(--r); background: linear-gradient(100deg, var(--panel) 30%, var(--panel-2) 50%, var(--panel) 70%); background-size: 300% 100%; animation: sk 1.4s linear infinite; border: 1px solid var(--line); }
.sk.tall { height: 340px; }
@keyframes sk { from { background-position: 100% 0; } to { background-position: 0 0; } }
.problem { max-width: 34rem; margin: 10vh auto; text-align: center; padding: 2rem; border-radius: 18px; background: var(--panel); border: 1px solid var(--line-2); }
.problem h1 { margin: 0 0 .4rem; font-size: 1.4rem; letter-spacing: -.02em; }
.problem p { color: var(--muted); margin: 0 0 1.2rem; }

/* ------------------------------------------------------------------ today */
.hello { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin: .2rem 0 1.1rem; }
.hello h1 { margin: 0; font-size: clamp(1.5rem, 2.6vw, 2.1rem); letter-spacing: -.03em; font-weight: 650; }
.hello h1 em { font-style: normal; background: linear-gradient(100deg, var(--amber-hot), var(--amber) 50%, var(--dawn)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hello p { margin: 0; color: var(--muted); }
.today-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; }
.panel { min-width: 0; padding: 1rem; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); }
.panel h2 { display: flex; align-items: center; gap: .55rem; margin: .1rem .25rem .85rem; font-size: 1rem; font-weight: 600; letter-spacing: -.01em; }
.panel h2 .n { margin-left: auto; font: 500 .74rem var(--mono); color: var(--faint); }
.list { display: grid; gap: .45rem; }
.item { display: grid; gap: .2rem; width: 100%; padding: .72rem .8rem; text-align: left; border-radius: 10px; border: 1px solid transparent; background: rgba(255, 255, 255, .025); transition: border-color .2s, background .2s, transform .2s var(--ease); }
.item:hover { border-color: var(--line-2); background: rgba(255, 255, 255, .045); transform: translateY(-1px); }
.item-top { display: flex; align-items: baseline; justify-content: space-between; gap: .7rem; min-width: 0; }
.item-top strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-sub { color: var(--muted); font-size: .88rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.item-sub q { color: var(--ink-2); quotes: "\201C" "\201D"; }
.task-row { display: flex; gap: .7rem; align-items: flex-start; padding: .65rem .8rem; border-radius: 10px; background: rgba(255, 255, 255, .025); }
.task-row > button { flex: 1; min-width: 0; display: grid; gap: .15rem; padding: 0; border: 0; background: none; text-align: left; }
.task-row > button:hover strong { color: var(--amber-hot); }
.task-row strong { font-weight: 500; transition: color .2s; overflow-wrap: anywhere; }
.task-row.is-done strong { color: var(--faint); text-decoration: line-through; }
.when { flex: none; font: 500 .72rem var(--mono); color: var(--faint); white-space: nowrap; }
.when.today { color: var(--amber); }
.when.late { color: var(--err); }
.empty { padding: 1.3rem .8rem; text-align: center; color: var(--faint); font-size: .9rem; border: 1px dashed var(--line-2); border-radius: 10px; }
.enter .panel, .enter .metric { animation: rise .55s var(--ease) both; }
.enter .panel:nth-child(2) { animation-delay: .06s; }
.enter .panel:nth-child(3) { animation-delay: .12s; }
.enter .panel:nth-child(4) { animation-delay: .18s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ------------------------------------------------------------------ stage colours */
.s-new { --c: #FFD08A; }
.s-contacted { --c: #9DB7E8; }
.s-call-booked { --c: #B9A2F2; }
.s-plan-sent { --c: #F2B055; }
.s-building { --c: #7FD1AE; }
.s-live { --c: #56D68F; }
.s-lost { --c: #6A7C98; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--faint)); box-shadow: 0 0 10px var(--c, transparent); }

/* ------------------------------------------------------------------ pipeline */
.board-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: .9rem; }
.board-head p { margin: 0; color: var(--muted); font-size: .9rem; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(186px, 1fr); gap: .6rem; overflow-x: auto; padding-bottom: .9rem; scroll-snap-type: x proximity; scrollbar-color: var(--panel-3) transparent; }
.col { display: flex; flex-direction: column; min-height: 62vh; border-radius: var(--r); background: rgba(13, 22, 41, .6); border: 1px solid var(--line); scroll-snap-align: start; transition: border-color .2s, background .2s, box-shadow .2s; }
.col.s-lost, .col.s-live { background: rgba(13, 22, 41, .38); }
.dragging .col { border-style: dashed; }
.col.is-over { border-color: var(--c); border-style: solid; background: color-mix(in srgb, var(--c) 7%, rgba(13, 22, 41, .7)); box-shadow: inset 0 0 0 1px var(--c), 0 0 40px -18px var(--c); }
.col-head { display: flex; align-items: center; gap: .5rem; padding: .8rem .9rem .75rem; border-bottom: 1px solid var(--line); }
.col-head b { font-weight: 600; font-size: .95rem; }
.col-head .n { font: 500 .72rem var(--mono); color: var(--faint); }
.col-head .sum { margin-left: auto; font: 500 .74rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.col-body { flex: 1; display: grid; align-content: start; gap: .5rem; padding: .5rem; }
@media (max-width: 860px) { .board { grid-auto-columns: minmax(240px, 82vw); } }
.col-empty { margin: .2rem 0 0; padding: 1rem .5rem; text-align: center; font-size: .82rem; color: var(--faint); border: 1px dashed var(--line); border-radius: 10px; }
.deal {
  position: relative; display: grid; gap: .3rem; padding: .75rem .85rem .8rem 1rem; text-align: left; width: 100%;
  border-radius: 11px; border: 1px solid var(--line); background: var(--panel-2);
  cursor: grab; transition: transform .25s var(--ease), border-color .2s, box-shadow .25s, opacity .2s;
}
.deal::before { content: ""; position: absolute; left: 0; top: .75rem; bottom: .75rem; width: 2px; border-radius: 2px; background: var(--c); }
.deal:hover { transform: translateY(-2px); border-color: var(--line-2); box-shadow: 0 16px 30px -18px rgba(0, 0, 0, .95); }
.deal:active { cursor: grabbing; }
.deal.is-drag { opacity: .3; transform: scale(.97); }
.deal.is-landed { animation: landed 1.2s var(--ease); }
@keyframes landed { 0% { border-color: var(--c); box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 70%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }
.enter .deal { animation: rise .5s var(--ease) both; }
.deal-top { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem; min-width: 0; }
.deal-top strong { font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.amt { flex: none; font: 500 .8rem var(--mono); color: var(--amber-hot); font-variant-numeric: tabular-nums; }
.deal-who { font-size: .85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deal-next { display: flex; gap: .5rem; align-items: baseline; font-size: .82rem; color: var(--ink-2); min-width: 0; }
.deal-next span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ------------------------------------------------------------------ tables */
.table-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: .9rem; }
.table-head h1 { margin: 0; font-size: 1.35rem; letter-spacing: -.02em; font-weight: 650; }
.table-head p { margin: 0; color: var(--muted); font-size: .9rem; }
.table-wrap { overflow: auto; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th { position: sticky; top: 0; z-index: 1; padding: .85rem 1rem; text-align: left; font: 500 .68rem var(--mono); letter-spacing: .13em; text-transform: uppercase; color: var(--faint); background: var(--panel); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: .78rem 1rem; border-bottom: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; transition: background .15s; }
tbody tr:hover, tbody tr:focus-visible { background: rgba(255, 255, 255, .035); outline: none; }
td.main { color: var(--ink); font-weight: 600; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.dim { color: var(--faint); }
/* Phones: each row becomes a small card instead of a table that scrolls sideways. */
@media (max-width: 640px) {
  .table-wrap table, .table-wrap tbody, .table-wrap tr, .table-wrap td { display: block; }
  .table-wrap thead { display: none; }
  .table-wrap tr { display: grid; grid-template-columns: 1fr auto; gap: .15rem .8rem; padding: .85rem 1rem; border-bottom: 1px solid var(--line); }
  .table-wrap tbody tr:last-child { border-bottom: 0; }
  .table-wrap td { padding: 0; border: 0; max-width: none; white-space: normal; overflow-wrap: anywhere; grid-column: 1; font-size: .88rem; }
  .table-wrap td.main { font-size: 1rem; }
  .table-wrap td.num { grid-column: 2; grid-row: 1; text-align: right; color: var(--amber-hot); }
  .table-wrap td:empty { display: none; }
  .table-wrap td.num + td.num { grid-row: 2; }
  .table-wrap td[data-suffix]::after { content: attr(data-suffix); }
}

/* ------------------------------------------------------------------ dialogs */
dialog { padding: 0; border: 0; color: var(--ink); background: transparent; max-width: none; max-height: none; }
dialog::backdrop { background: rgba(2, 5, 12, .62); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.drawer { position: fixed; inset: 0 0 0 auto; margin: 0; width: min(580px, 100vw); height: 100%; overflow-y: auto; overscroll-behavior: contain; background: var(--night-1); border-left: 1px solid var(--line-2); box-shadow: -40px 0 90px -30px rgba(0, 0, 0, .9); }
.drawer[open] { animation: slide .38s var(--ease); }
@keyframes slide { from { transform: translateX(48px); opacity: 0; } }
.modal { margin: auto; width: min(640px, calc(100vw - 1.5rem)); max-height: calc(100dvh - 1.5rem); overflow-y: auto; background: var(--night-1); border: 1px solid var(--line-2); border-radius: 18px; box-shadow: 0 40px 100px -30px rgba(0, 0, 0, .95); }
.modal[open] { animation: pop .3s var(--ease); }
@keyframes pop { from { transform: translateY(12px) scale(.98); opacity: 0; } }
.modal-body { display: grid; gap: 1rem; padding: 1.3rem 1.4rem 1.4rem; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.modal-head h2 { margin: 0; font-size: 1.3rem; letter-spacing: -.02em; font-weight: 650; }
fieldset { display: grid; gap: .8rem; margin: 0; padding: 0; border: 0; }
legend { padding: 0; margin-bottom: .6rem; font: 500 .7rem var(--mono); letter-spacing: .15em; text-transform: uppercase; color: var(--amber); }
.modal-foot { display: flex; justify-content: flex-end; align-items: center; gap: .6rem; padding-top: .3rem; }
.form-err { margin: 0; min-height: 1.2em; color: var(--err); font-size: .9rem; }
.hint { color: var(--faint); font-size: .85rem; }
.hint.warn { color: var(--amber); }

.dr { display: grid; gap: 1.3rem; padding: 1.3rem 1.4rem 2.4rem; }
.dr-head { position: relative; padding-right: 3rem; }
.dr-kicker { display: flex; align-items: center; gap: .5rem; font: 500 .7rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.dr-head h2 { margin: .5rem 0 0; font-size: 1.7rem; line-height: 1.12; letter-spacing: -.03em; font-weight: 650; overflow-wrap: anywhere; }
.dr-sub { margin: .25rem 0 0; color: var(--muted); }
.dr-amt { margin-top: .5rem; font: 500 1.05rem var(--mono); color: var(--amber-hot); }
.dr-close { position: absolute; top: 0; right: 0; }
.dr-people { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
@media (max-width: 520px) { .dr-people { grid-template-columns: 1fr; } }
.who { min-width: 0; padding: .85rem .9rem; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: .15rem; align-content: start; }
.who-label { display: flex; justify-content: space-between; align-items: center; font: 500 .66rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-bottom: .2rem; }
.who-label button { border: 0; background: none; padding: 0; font: inherit; letter-spacing: inherit; color: var(--amber); }
.who-label button:hover { color: var(--amber-hot); }
.who strong { font-weight: 600; overflow-wrap: anywhere; }
.who span, .who a { font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who span { color: var(--muted); }
.dr-form { display: grid; gap: .85rem; padding: 1.1rem; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.chips { display: flex; gap: .35rem; flex-wrap: wrap; align-self: end; padding-bottom: .15rem; }
.chip { height: 30px; padding: 0 .65rem; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--ink-2); font-size: .82rem; transition: border-color .2s, color .2s, background .2s; }
.chip:hover { border-color: var(--amber); color: var(--ink); background: var(--amber-soft); }
.dr-actions { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.dr-log h3 { margin: 0 0 .8rem; font-size: 1rem; font-weight: 600; }
.log-form { display: grid; gap: .6rem; margin-bottom: 1.3rem; }
.seg { display: flex; gap: .3rem; flex-wrap: wrap; }
.seg button { height: 30px; padding: 0 .7rem; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .84rem; transition: color .2s, border-color .2s, background .2s; }
.seg button:hover { color: var(--ink); }
.seg button[aria-checked="true"] { color: var(--ink); border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
.log-row { display: flex; gap: .7rem; align-items: end; justify-content: space-between; }
.log-row .field { max-width: 190px; }
.log-row .btn { margin-left: auto; }

.timeline { position: relative; margin: 0; padding: 0; list-style: none; }
.timeline::before { content: ""; position: absolute; left: 6px; top: .5rem; bottom: .5rem; width: 1px; background: var(--line-2); }
.tl { position: relative; padding: 0 0 1.05rem 1.65rem; }
.tl::before { content: ""; position: absolute; left: 1px; top: .32rem; width: 11px; height: 11px; border-radius: 50%; background: var(--night-1); border: 2px solid var(--c); }
.tl.is-new { animation: rise .45s var(--ease); }
.tl-head { display: flex; align-items: baseline; gap: .65rem; flex-wrap: wrap; }
.badge { font: 500 .66rem/1 var(--mono); letter-spacing: .13em; text-transform: uppercase; color: var(--c); }
.tl-body { margin-top: .3rem; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.task-line { display: flex; gap: .6rem; align-items: flex-start; margin-top: .3rem; cursor: pointer; }
.task-line .tl-body { margin-top: 0; }
.tl.is-done .tl-body { color: var(--faint); text-decoration: line-through; }
.t-inquiry { --c: #FFD08A; }
.t-stage { --c: #B9A2F2; }
.t-note { --c: #9DB7E8; }
.t-call { --c: #7FD1AE; }
.t-email { --c: #8ED0EE; }
.t-meeting { --c: #F2B055; }
.t-task { --c: #FF8F4D; }

/* ------------------------------------------------------------------ toast */
/* A manual popover, so it sits in the top layer above any open dialog. */
.toast {
  position: fixed; inset: auto auto 1.4rem 50%; margin: 0; overflow: visible; color: var(--ink); z-index: 100;
  display: flex; align-items: center; gap: .9rem; max-width: calc(100vw - 2rem);
  padding: .7rem .75rem .7rem 1rem; border-radius: 12px;
  background: var(--panel-3); border: 1px solid var(--line-2); box-shadow: 0 24px 60px -24px rgba(0, 0, 0, .95);
  translate: -50% 12px; opacity: 0; pointer-events: none;
  transition: opacity .25s, translate .3s var(--ease);
}
.toast.is-on { translate: -50% 0; opacity: 1; pointer-events: auto; }
.toast:not(:popover-open) { display: none; }
.toast.err { border-color: rgba(255, 138, 115, .5); }
.toast.err::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--err); flex: none; }
.toast .btn { height: 30px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="brand">
    <svg viewBox="0 0 26 26" aria-hidden="true"><mask id="moon"><rect width="26" height="26" fill="white"/><circle cx="17.5" cy="10.5" r="9" fill="black"/></mask><circle cx="13" cy="13" r="12" fill="#F2B055" mask="url(#moon)"/></svg>
    Third Shift <span class="tag">CRM</span>
  </div>
  <nav class="tabs" aria-label="Views">
    <button type="button" data-view="today">Today <span class="pill" id="today-n" hidden></span></button>
    <button type="button" data-view="pipeline">Pipeline</button>
    <button type="button" data-view="contacts">Contacts</button>
    <button type="button" data-view="companies">Companies</button>
  </nav>
  <div class="bar-right">
    <label class="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
      <span class="sr">Search</span>
      <input id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </label>
    <button type="button" class="icon-btn only-narrow" id="search-open" aria-label="Search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
    </button>
    <span class="me" id="me"></span>
    <button type="button" class="btn" id="new-deal">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      New deal
    </button>
  </div>
</header>

<div class="wrap">
  <section class="metrics" id="metrics" aria-label="Pipeline at a glance"></section>
  <main id="view">
    <div class="loading" aria-label="Loading">
      <div class="sk"></div>
      <div class="sk tall"></div>
    </div>
  </main>
</div>

<dialog class="drawer" id="drawer" aria-labelledby="dr-title"></dialog>
<dialog class="modal" id="modal"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" popover="manual"></div>

<script>
"use strict";

// ------------------------------------------------------------------ server calls

// One promise per call to the Apps Script functions in Crm.gs.
function api(name, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args);
  });
}

// The message from a failed call, without the "Error: " Apps Script sometimes puts in front.
function messageOf(err) {
  const raw = err && err.message ? err.message : String(err || "Something went wrong.");
  return raw.replace(/^(Exception|Error|ScriptError):\s*/i, "");
}

// ------------------------------------------------------------------ small helpers

const $ = (sel, root = document) => root.querySelector(sel);
const VIEWS = ["today", "pipeline", "contacts", "companies"];

// Builds DOM. Strings become text nodes, so nothing from the sheet is ever parsed as HTML.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "dataset") Object.assign(el.dataset, v);
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : String(v));
    }
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false || kid === "") continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function svg(path, size = 16) {
  const ns = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(ns, "svg");
  s.setAttribute("viewBox", `0 0 ${size} ${size}`);
  s.setAttribute("fill", "none");
  s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "1.8");
  s.setAttribute("stroke-linecap", "round");
  s.setAttribute("aria-hidden", "true");
  const p = document.createElementNS(ns, "path");
  p.setAttribute("d", path);
  s.append(p);
  return s;
}
const xIcon = () => svg("M4 4l8 8M12 4l-8 8");

const by = (fn) => (a, b) => { const x = fn(a), y = fn(b); return x < y ? -1 : x > y ? 1 : 0; };
const num = (v) => (v === "" || v == null || isNaN(+v) ? 0 : +v);
const sum = (list) => list.reduce((a, b) => a + b, 0);
const uniq = (list) => [...new Set(list)];
const stageClass = (s) => "s-" + String(s || "").toLowerCase().replace(/[^a-z]+/g, "-");
const typeClass = (t) => "t-" + String(t || "note").toLowerCase().replace(/[^a-z]+/g, "-");
const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

const moneyFmt = new Intl.NumberFormat("en-CA", { style: "currency", currency: "CAD", maximumFractionDigits: 0 });
function money(v) { return v === "" || v == null ? "" : moneyFmt.format(num(v)); }
function moneyShort(v) {
  const n = num(v);
  if (n >= 1e6) return "$" + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M";
  if (n >= 1e4) return "$" + Math.round(n / 1e3) + "K";
  return moneyFmt.format(n);
}

// ------------------------------------------------------------------ dates (all in Toronto time)

// Dates from the server are "yyyy-MM-dd" or "yyyy-MM-ddTHH:mm:ss" in Toronto time with no zone.
// Treating both sides as UTC keeps the arithmetic exact.
const naive = (s) => Date.parse(s.length === 10 ? s + "T00:00:00Z" : s + "Z");
const isoDay = (ms) => new Date(ms).toISOString().slice(0, 10);
const torontoParts = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Toronto", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
function torontoNow() {
  const p = Object.fromEntries(torontoParts.formatToParts(new Date()).map((x) => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}`;
}
const dayFmt = new Intl.DateTimeFormat("en-CA", { timeZone: "UTC", month: "short", day: "numeric" });
const weekdayFmt = new Intl.DateTimeFormat("en-CA", { timeZone: "UTC", weekday: "long" });
const longFmt = new Intl.DateTimeFormat("en-CA", { timeZone: "UTC", weekday: "long", month: "long", day: "numeric" });
const shortDate = (d) => dayFmt.format(naive(d.slice(0, 10)));
const dayDiff = (from, to) => Math.round((naive(to) - naive(from)) / 864e5);
const addDays = (d, n) => isoDay(naive(d) + n * 864e5);
function nextBusinessDay(d) {
  let x = addDays(d, 1);
  while ([0, 6].includes(new Date(naive(x)).getUTCDay())) x = addDays(x, 1);
  return x;
}

function ago(iso) {
  if (!iso) return "";
  const mins = Math.round((naive(torontoNow()) - naive(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + " min ago";
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + " h ago";
  const days = dayDiff(iso.slice(0, 10), S.data.today);
  if (days <= 1) return "yesterday";
  if (days < 7) return days + " days ago";
  return shortDate(iso);
}

// "today", "tomorrow", "3 days late", "Friday", "Nov 4"
function due(date, done = false) {
  if (!date) return null;
  const n = dayDiff(S.data.today, date);
  let text, cls = "";
  if (n === 0) { text = "today"; cls = "today"; }
  else if (n === 1) text = "tomorrow";
  else if (n === -1) { text = "yesterday"; cls = "late"; }
  else if (n < 0) { text = -n + " days late"; cls = "late"; }
  else if (n < 7) text = weekdayFmt.format(naive(date));
  else text = shortDate(date);
  return h("span", { class: "when " + (done ? "" : cls) }, text);
}

// ------------------------------------------------------------------ state

const S = { data: null, view: "today", q: "", loadedAt: 0, animate: true, flash: null, openDeal: null, counted: false };
let IX = null;

try { const v = localStorage.getItem("ts-crm-view"); if (VIEWS.includes(v)) S.view = v; } catch { /* storage blocked */ }

function index() {
  const d = S.data;
  const acts = new Map();
  for (const a of d.activities) {
    if (!acts.has(a.deal_id)) acts.set(a.deal_id, []);
    acts.get(a.deal_id).push(a);
  }
  for (const list of acts.values()) list.sort((a, b) => String(b.created).localeCompare(String(a.created)));
  IX = {
    co: new Map(d.companies.map((c) => [c.id, c])),
    ct: new Map(d.contacts.map((c) => [c.id, c])),
    deal: new Map(d.deals.map((x) => [x.id, x])),
    acts,
    open: new Set(d.openStages),
    won: new Set(d.wonStages),
  };
}

const isOpen = (deal) => IX.open.has(deal.stage);
const dealName = (deal) => (IX.co.get(deal.company_id) || {}).name || deal.title || "Untitled";
const openTasks = () => S.data.activities.filter((a) => a.type === "Task" && a.done !== "yes");

function upsert(list, rec) {
  const i = list.findIndex((x) => x.id === rec.id);
  if (i === -1) list.push(rec); else list[i] = rec;
}

// Merge whatever a save sent back, then redraw.
function applyResult(r) {
  if (!r) return;
  if (r.company) upsert(S.data.companies, r.company);
  if (r.contact) upsert(S.data.contacts, r.contact);
  if (r.deal) upsert(S.data.deals, r.deal);
  if (r.activity) upsert(S.data.activities, r.activity);
  index();
  render();
}

// ------------------------------------------------------------------ search

function matches(...fields) {
  if (!S.q) return true;
  return fields.some((f) => f != null && String(f).toLowerCase().includes(S.q));
}
function matchDeal(deal) {
  const co = IX.co.get(deal.company_id), p = IX.ct.get(deal.contact_id);
  return matches(deal.title, deal.next_step, deal.source, co && co.name, co && co.city, p && p.name, p && p.email);
}

// ------------------------------------------------------------------ rendering

function render() {
  if (!S.data) return;
  renderTabs();
  renderMetrics();
  const view = $("#view");
  const scroller = view.querySelector(".board");
  const keepX = scroller ? scroller.scrollLeft : 0;
  const node = { today: viewToday, pipeline: viewPipeline, contacts: viewContacts, companies: viewCompanies }[S.view]();
  view.replaceChildren(node);
  const board = view.querySelector(".board");
  if (board && !S.animate) board.scrollLeft = keepX;
  if (S.flash) {
    const el = view.querySelector(`[data-id="${CSS.escape(S.flash)}"]`);
    if (el) el.classList.add("is-landed");
    S.flash = null;
  }
  S.animate = false;
  if ($("#drawer").open) fillTimeline();
}

function attention() {
  const today = S.data.today;
  const open = S.data.deals.filter(isOpen);
  const fresh = open.filter((d) => d.stage === "New");
  const followUps = open.filter((d) => d.stage !== "New" && d.next_date && d.next_date <= today);
  const tasks = openTasks().filter((a) => a.due && a.due <= today);
  const late = followUps.filter((d) => d.next_date < today).length + tasks.filter((a) => a.due < today).length;
  return { fresh, followUps, tasks, total: fresh.length + followUps.length + tasks.length, late };
}

function renderTabs() {
  for (const b of document.querySelectorAll(".tabs button")) {
    if (b.dataset.view === S.view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  }
  const n = attention().total;
  const pill = $("#today-n");
  pill.hidden = !n;
  pill.textContent = String(n);
}

function renderMetrics() {
  const d = S.data;
  const open = d.deals.filter(isOpen);
  const openValue = sum(open.map((x) => num(x.value)));
  const today = d.today;
  const qStart = today.slice(0, 5) + String(Math.floor((+today.slice(5, 7) - 1) / 3) * 3 + 1).padStart(2, "0") + "-01";
  const wonQ = d.deals.filter((x) => IX.won.has(x.stage) && x.closed && x.closed >= qStart);
  const closed = d.deals.filter((x) => !isOpen(x));
  const won = closed.filter((x) => IX.won.has(x.stage));
  const a = attention();

  const tiles = [
    { label: "Open pipeline", value: openValue, fmt: moneyShort, sub: `${open.length} open ${open.length === 1 ? "deal" : "deals"}` },
    { label: "Won this quarter", value: sum(wonQ.map((x) => num(x.value))), fmt: moneyShort, sub: `${wonQ.length} ${wonQ.length === 1 ? "client" : "clients"} signed`, cls: "hot" },
    { label: "Win rate", value: closed.length ? Math.round((won.length / closed.length) * 100) : null, fmt: (v) => (v == null ? "No data" : v + "%"), sub: closed.length ? `${won.length} of ${closed.length} closed` : "Nothing closed yet" },
    { label: "Needs you today", value: a.total, fmt: (v) => String(v), sub: a.late ? `${a.late} overdue` : "Nothing overdue", cls: a.late ? "late" : "" },
  ];
  const box = $("#metrics");
  box.classList.toggle("enter", !S.counted);
  box.replaceChildren(...tiles.map((t) => {
    const val = h("div", { class: "m-value" }, t.fmt(t.value));
    if (!S.counted && typeof t.value === "number" && t.value > 0) countUp(val, t.value, t.fmt);
    return h("div", { class: "metric " + (t.cls || "") }, h("div", { class: "m-label" }, t.label), val, h("div", { class: "m-sub" }, t.sub));
  }));
  S.counted = true;
}

function countUp(el, target, fmt) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const start = performance.now(), dur = 900;
  const tick = (now) => {
    const t = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = fmt(t < 1 ? Math.round(target * eased) : target);
    if (t < 1) requestAnimationFrame(tick);
  };
  el.textContent = fmt(0);
  requestAnimationFrame(tick);
}

// ------------------------------------------------------------------ Today

function greeting() {
  const hr = +torontoNow().slice(11, 13);
  if (hr < 5) return ["Still up? ", h("em", null, "Here's the night")];
  if (hr < 12) return ["Good morning. ", h("em", null, "Here's the day")];
  if (hr < 17) return ["Good afternoon. ", h("em", null, "Here's what's open")];
  return ["Good evening. ", h("em", null, "Here's what's left")];
}

function panel(title, stage, items, renderItem, emptyText) {
  return h("section", { class: "panel" },
    h("h2", null, h("span", { class: "dot " + (stage ? stageClass(stage) : "") }), title, h("span", { class: "n" }, items.length || "")),
    items.length ? h("div", { class: "list" }, items.map(renderItem)) : h("p", { class: "empty" }, emptyText));
}

function dealItem(deal, when, ...subs) {
  return h("button", { type: "button", class: "item", dataset: { id: deal.id }, onclick: () => openDeal(deal.id) },
    h("div", { class: "item-top" }, h("strong", null, dealName(deal)), when),
    subs.filter(Boolean).map((s) => h("div", { class: "item-sub" }, s)));
}

function inquiryItem(deal) {
  const p = IX.ct.get(deal.contact_id);
  const inq = (IX.acts.get(deal.id) || []).find((a) => a.type === "Inquiry");
  const snippet = inq && inq.summary ? h("q", null, inq.summary.length > 160 ? inq.summary.slice(0, 157) + "..." : inq.summary) : null;
  return dealItem(deal, h("span", { class: "when today" }, ago(deal.created)), p ? [p.name, p.email ? " · " + p.email : ""].join("") : null, snippet);
}

function followItem(deal) {
  const p = IX.ct.get(deal.contact_id);
  return dealItem(deal, due(deal.next_date), deal.next_step || "Follow up", p ? `${p.name} · ${deal.stage}` : deal.stage);
}

function taskItem(task) {
  const deal = IX.deal.get(task.deal_id);
  const done = task.done === "yes";
  const box = h("input", { type: "checkbox", "aria-label": "Done: " + task.summary });
  box.checked = done;
  box.addEventListener("change", () => toggleTask(task, box.checked));
  return h("div", { class: "task-row" + (done ? " is-done" : ""), dataset: { id: task.id } },
    box,
    h("button", { type: "button", onclick: () => deal && openDeal(deal.id) },
      h("strong", null, task.summary),
      h("span", { class: "item-sub" }, deal ? dealName(deal) : "")),
    task.due ? due(task.due, done) : h("span", { class: "when" }, "no date"));
}

function soonItem(x) {
  return x.kind === "task" ? taskItem(x.task) : dealItem(x.deal, due(x.date), x.deal.next_step || "Follow up");
}

function viewToday() {
  const today = S.data.today, weekOut = addDays(today, 7);
  const a = attention();
  const fresh = a.fresh.filter(matchDeal).sort(by((d) => d.created));
  const followUps = a.followUps.filter(matchDeal).sort(by((d) => d.next_date));
  const tasks = openTasks().filter((t) => !t.due || t.due <= today)
    .filter((t) => { const d = IX.deal.get(t.deal_id); return matches(t.summary) || (d && matchDeal(d)); })
    .sort(by((t) => t.due || "9999"));
  const soon = [
    ...S.data.deals.filter((d) => isOpen(d) && d.next_date > today && d.next_date <= weekOut && matchDeal(d)).map((d) => ({ kind: "deal", deal: d, date: d.next_date })),

const drawer = $("#drawer");
const modal = $("#modal");

function isDirty(dlg) {
  if (dlg === drawer) {
    const f = $(".dr-form", drawer);
    const t = $(".log-form textarea", drawer);
    return !!((f && f.dataset.dirty === "yes") || (t && t.value.trim()));
  }
  return !!$("form[data-dirty='yes']", dlg);
}

function tryClose(dlg) {
  if (isDirty(dlg) && !confirm("Discard your changes?")) return;
  dlg.close();
}

for (const dlg of [drawer, modal]) {
  dlg.addEventListener("cancel", (e) => { e.preventDefault(); tryClose(dlg); });
  // A click on the dimmed backdrop lands on the dialog itself, outside its box.
  dlg.addEventListener("mousedown", (e) => {
    if (e.target !== dlg) return;
    const r = dlg.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) tryClose(dlg);
  });
}
drawer.addEventListener("close", () => { S.openDeal = null; drawer.replaceChildren(); });
modal.addEventListener("close", () => modal.replaceChildren());

function trackDirty(form) {

function openModal(content, focusSel) {

function dealForm(deal) {
  const today = S.data.today;

  const form = h("form", { class: "dr-form", novalidate: true },

    lost,

  const changes = () => {
    const out = {};

      const v = el.value.trim();
      if (v !== String(deal[k] == null ? "" : deal[k])) out[k] = v;

  form.addEventListener("change", sync);

    e.preventDefault();

// ------------------------------------------------------------------ edit contact / company

function editRecord(title, rec, fields, call, key) {
  const err = h("p", { class: "form-err", role: "alert" });
  const submit = h("button", { class: "btn", type: "submit" }, "Save");
  const control = (f) => f.type === "textarea"
    ? h("textarea", { name: f.name, rows: "4", maxlength: "2000" }, rec[f.name] || "")
    : input({ type: f.type || "text", name: f.name, value: rec[f.name] || "", maxlength: f.max || 160, autocomplete: "off" });
  const rows = [];
  for (let i = 0; i < fields.length; i++) {
    const f = fields[i];
    if (f.wide) rows.push(field(f.label, control(f)));
    else { const g = fields[i + 1]; rows.push(h("div", { class: "grid2" }, field(f.label, control(f)), g && !g.wide ? field(g.label, control(g)) : null)); if (g && !g.wide) i++; }
  }
  const form = h("form", { class: "modal-body", novalidate: true },
    h("header", { class: "modal-head" }, h("h2", null, title), closeButton(modal)),
    rows, err,
    h("footer", { class: "modal-foot" }, h("button", { class: "btn btn-ghost", type: "button", onclick: () => tryClose(modal) }, "Cancel"), submit));
  trackDirty(form);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const patch = { id: rec.id, updated: rec.updated };
    let changed = 0;
    for (const f of fields) {
      const v = form.elements[f.name].value.trim();
      if (v !== String(rec[f.name] == null ? "" : rec[f.name])) { patch[f.name] = v; changed++; }
    }
    if (!changed) { modal.close(); return; }
    if ("email" in patch && patch.email && !EMAIL.test(patch.email)) { err.textContent = "That email doesn't look right."; return; }
    submit.disabled = true;
    submit.textContent = "Saving...";
    try {
      const r = await api(call, patch);
      form.dataset.dirty = "";
      modal.close();
      applyResult(r);
      if (drawer.open) fillDrawer();
      toast("Saved");
    } catch (e2) {
      err.textContent = messageOf(e2);
      submit.disabled = false;
      submit.textContent = "Save";
      if (/^CHANGED/.test(messageOf(e2))) err.textContent = "This record was changed in the sheet. Close, reload, and try again.";
    }
  });
  openModal(form);
}

function editContact(c) {
  editRecord("Edit contact", c, [
    { name: "name", label: "Name", max: 120 }, { name: "title", label: "Title", max: 120 },
    { name: "email", label: "Email", type: "email" }, { name: "phone", label: "Phone", type: "tel", max: 40 },
    { name: "notes", label: "Notes", type: "textarea", wide: true },
  ], "crmSaveContact");
}

function editCompany(c) {
  editRecord("Edit company", c, [
    { name: "name", label: "Name" }, { name: "website", label: "Website", max: 300 },
    { name: "city", label: "City", max: 80 }, { name: "industry", label: "Industry", max: 80 },
    { name: "size", label: "Size", max: 40 },
    { name: "notes", label: "Notes", type: "textarea", wide: true },
  ], "crmSaveCompany");
}

// ------------------------------------------------------------------ toast

let toastTimer = 0;
const toastEl = $("#toast");
const canPop = typeof toastEl.showPopover === "function";

function toast(msg, opts = {}) {
  toastEl.className = "toast" + (opts.err ? " err" : "");
  const parts = [h("span", null, msg)];
  if (opts.action) parts.push(h("button", { type: "button", class: "btn btn-sm", onclick: () => { hideToast(); opts.action.fn(); } }, opts.action.label));
  toastEl.replaceChildren(...parts);
  // Showing it again puts it on top of whatever dialog opened since.
  if (canPop) {
    if (toastEl.matches(":popover-open")) toastEl.hidePopover();
    toastEl.showPopover();
  }
  requestAnimationFrame(() => toastEl.classList.add("is-on"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, opts.action ? 9000 : opts.err ? 6000 : 2600);
}

function hideToast() {
  toastEl.classList.remove("is-on");
  setTimeout(() => {
    if (canPop && !toastEl.classList.contains("is-on") && toastEl.matches(":popover-open")) toastEl.hidePopover();
  }, 320);
}

function fail(err) {
  const msg = messageOf(err);
  if (/^CHANGED/.test(msg)) {
    toast("Someone changed this in the sheet. Reload to see the latest.", { err: true, action: { label: "Reload", fn: () => { if (drawer.open) drawer.close(); load(); } } });
  } else {
    toast(msg, { err: true });
  }
}

// ------------------------------------------------------------------ loading

async function load({ quiet = false } = {}) {
  try {
    S.data = await api("crmLoad");
    S.loadedAt = Date.now();
    index();
    $("#me").textContent = S.data.me || "";
    $("#me").title = S.data.me ? "Signed in as " + S.data.me : "";
    if (!quiet) S.animate = true;
    render();
    if (drawer.open) fillDrawer();
  } catch (err) {
    if (quiet) return;
    const msg = messageOf(err);
    $("#metrics").replaceChildren();
    $("#view").replaceChildren(h("div", { class: "problem" },
      h("h1", null, /authorized/i.test(msg) ? "This account isn't on the list" : "The CRM didn't load"),
      h("p", null, /authorized/i.test(msg) ? "Sign in with the Google account named in the CRM_USERS script property." : msg),
      h("button", { type: "button", class: "btn", onclick: () => { $("#view").replaceChildren(h("div", { class: "loading" }, h("div", { class: "sk" }), h("div", { class: "sk tall" }))); load(); } }, "Try again")));
  }
}

// ------------------------------------------------------------------ wiring

function setView(v) {
  if (!VIEWS.includes(v) || !S.data) return;
  if (v !== S.view) S.animate = true;
  S.view = v;
  try { localStorage.setItem("ts-crm-view", v); } catch { /* storage blocked */ }
  render();
  window.scrollTo(0, 0);
}

for (const b of document.querySelectorAll(".tabs button")) b.addEventListener("click", () => setView(b.dataset.view));
$("#new-deal").addEventListener("click", newDeal);

let searchTimer = 0;
const q = $("#q");
q.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { S.q = q.value.trim().toLowerCase(); render(); }, 90);
});
q.addEventListener("keydown", (e) => { if (e.key === "Escape") { q.value = ""; S.q = ""; render(); q.blur(); } });
q.addEventListener("blur", () => { if (!q.value) $("#bar").classList.remove("searching"); });
$("#search-open").addEventListener("click", () => { $("#bar").classList.add("searching"); q.focus(); });

document.addEventListener("keydown", (e) => {
  if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
  if (document.querySelector("dialog[open]")) return;
  if (e.target.closest && e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "/") { e.preventDefault(); $("#bar").classList.add("searching"); q.focus(); }
  else if (e.key === "n") { e.preventDefault(); newDeal(); }
  else if (/^[1-4]$/.test(e.key)) setView(VIEWS[+e.key - 1]);
});

// Coming back to the tab after a while picks up anything the website form added meanwhile.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.data && Date.now() - S.loadedAt > 60000 && !isDirty(drawer) && !modal.open) load({ quiet: true });
});

load();
</script>
